<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Loja Magnética</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2;--card:#FFFFFF;--soft:#F6F1E9;--line:#ECE4D8;
  --ink:#1F1A17;--text:#4A413B;--muted:#8A7F76;
  --accent:#BC4914;--accentbg:#FBEDE5;--choco:#511E0C;--navy:#08163A;--navybg:#E8EBF3;
  --good:#1F8A5B;--goodbg:#E6F4EC;--bad:#C2341B;--badbg:#FCEBE6;--warn:#B7791F;--warnbg:#FDF3E1;
  --side:#1E120D;--side2:#2B1A13;--sidetext:#E9DED6;--sidemuted:#9C8B80;
  --grad:linear-gradient(90deg,#08163A,#6F2F18 35%,#BC4914 70%,#E08A3C);
  --f-body:"Inter","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-head:"Montserrat","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --r:14px;--fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D;--card:#211915;--soft:#2A201B;--line:#3A2E27;
    --ink:#F5EEE8;--text:#D9CCC2;--muted:#A3958A;
    --accentbg:#3A2117;--navybg:#1C2236;--goodbg:#15302A;--badbg:#3A1A14;--warnbg:#36291A;
  }
}
:root[data-theme="dark"]{
  --bg:#15100D;--card:#211915;--soft:#2A201B;--line:#3A2E27;
  --ink:#F5EEE8;--text:#D9CCC2;--muted:#A3958A;
  --accentbg:#3A2117;--navybg:#1C2236;--goodbg:#15302A;--badbg:#3A1A14;--warnbg:#36291A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:var(--fs);line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-head);color:var(--ink);margin:0 0 .4em;line-height:1.2}
h1{font-size:1.6em;font-weight:800}h2{font-size:1.2em;font-weight:700}h3{font-size:1.02em;font-weight:700}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:268px;flex-shrink:0;background:var(--side);color:var(--sidetext);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:var(--f-head);font-weight:800;font-size:15px}
.brand b{font-family:var(--f-head);display:block;font-size:15px;color:#fff}
.brand small{color:var(--sidemuted);font-size:12px}
.role{margin:0 14px 10px;display:flex;background:var(--side2);border-radius:10px;padding:3px}
.role button{flex:1;border:0;background:none;color:var(--sidemuted);padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.role button.on{background:#fff;color:var(--side)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav .grp{font-family:var(--f-head);font-size:11px;letter-spacing:.08em;color:var(--sidemuted);font-weight:700;margin:14px 10px 4px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--sidetext);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--side2)}
.nav a.on{background:var(--side2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav a.ai{border:1px solid #6F2F18;background:linear-gradient(90deg,#2B1A13,#3a1d10)}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.tag{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#E0B43C;color:#3a2a00;white-space:nowrap}
.dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#E5533D}
.me{border-top:1px solid #33241c;padding:12px 16px;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:#E08A3C;color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--f-head)}
.me b{color:#fff;font-size:14px;display:block}.me small{color:var(--sidemuted);font-size:12px}
.online{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ccf7a;margin-left:4px}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.banner{background:var(--accent);color:#fff;text-align:center;font-size:13.5px;padding:8px 14px;font-weight:600}
.banner a{color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:99px;padding:2px 10px;margin-left:8px;text-decoration:none;white-space:nowrap}
.top{display:flex;align-items:center;gap:8px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--card)}
.top .burger{display:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:7px 12px;color:var(--muted)}
.search input{border:0;background:none;outline:none;width:100%}
.tools{margin-left:auto;display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.ib svg{width:17px;height:17px}
.content{padding:26px 28px 60px;max-width:1180px;width:100%}
.sub{color:var(--muted);margin:-2px 0 20px}
.proto{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--navybg);color:var(--navy);padding:3px 8px;border-radius:6px;margin-bottom:10px}
:root[data-theme="dark"] .proto{color:#AFC0EE}
/* Cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.hero{background:var(--grad);color:#fff;border-radius:18px;padding:24px 26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{color:#fff}.hero p{margin:0;opacity:.9}
.hero .meet{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px;min-width:230px}
.hero .meet small{opacity:.8;display:block}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.p{background:var(--accent);color:#fff}.btn.s{background:var(--soft);color:var(--ink)}.btn.w{background:#fff;color:var(--choco)}
.btn.sm{padding:6px 11px;font-size:13px}
.shortcuts{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600}
.sc:hover{border-color:var(--accent)}
.sc .ic{width:40px;height:40px;border-radius:12px;margin:0 auto 8px;display:grid;place-items:center;background:var(--accentbg);color:var(--accent)}
.sc .ic svg{width:20px;height:20px}
.sectitle{font-family:var(--f-head);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 11px;font-size:13px;text-decoration:none;color:var(--text)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--goodbg);color:var(--good)}.pill.go{background:var(--accentbg);color:var(--accent)}
.pill.no{background:var(--soft);color:var(--muted)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.wa{background:var(--warnbg);color:var(--warn)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;background:var(--soft);color:var(--ink);flex-shrink:0}
.step.done .num{background:var(--goodbg);color:var(--good)}.step.now .num{background:var(--accent);color:#fff}
.step p{margin:2px 0 0;color:var(--muted);font-size:14px}
.step .r{margin-left:auto;text-align:right}
/* Scripts */
.scard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;text-decoration:none;color:var(--ink)}
.scard:hover{box-shadow:0 4px 18px rgba(81,30,12,.08)}
.scard .ic{width:40px;height:40px;border-radius:12px;margin:0 auto 8px;display:grid;place-items:center;background:var(--soft);color:var(--c,var(--accent))}
.scard .ic svg{width:20px;height:20px}
.scard b{font-family:var(--f-head);display:block}.scard small{color:var(--muted)}
.scard.new{border:1.5px dashed var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:600}
.script{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.script .when{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.script pre{white-space:pre-wrap;font-family:var(--f-body);background:var(--soft);border-radius:10px;padding:14px;margin:0 0 12px;color:var(--ink);font-size:14.5px}
.var{background:var(--accentbg);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
/* Forms */
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:var(--r);padding:12px;min-height:200px}
.col h3{font-size:13px;display:flex;justify-content:space-between}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13.5px}
.kc .mv{display:flex;justify-content:space-between;margin-top:8px}
.kc .mv button{border:0;background:var(--soft);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--muted)}
/* Months */
.month{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);display:block}
.month:hover{border-color:var(--accent)}
.month b{font-family:var(--f-head);font-size:16px}
.month small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{max-width:78%;padding:11px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer input{flex:1}
.kpi b{font-family:var(--f-head);font-size:28px;color:var(--ink);display:block}
.kpi small{color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border:0}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.muted{color:var(--muted)}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.overlay{display:none}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.shortcuts{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .side{position:fixed;left:-290px;z-index:40;transition:left .2s}
  .side.open{left:0}
  .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .top{padding:10px 16px}.top .burger{display:grid}
  .content{padding:18px 16px 60px}
  .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
  .shortcuts{grid-template-columns:repeat(4,1fr)}
  .hero .meet{margin-left:0;width:100%}
  .msg{max-width:90%}
  .step{flex-wrap:wrap}.step .r{margin-left:48px;text-align:left}
  .search{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">LM</div><div><b>Loja Magnética</b><small>Hub · Portal da Mentoria</small></div></div>
    <div class="role"><button data-role="mentorado">Mentorado(a)</button><button data-role="equipe">Equipe</button></div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="banner" id="banner"></div>
    <header class="top">
      <button class="ib burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar no Hub (scripts, aulas, páginas)…"></div>
      <div class="tools">
        <button class="ib" id="fontBtn" title="Aumentar letra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19 9 5l5 14M6 14h6M18 8v6M15 11h6"/></svg></button>
        <button class="ib" id="themeBtn" title="Modo escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Ícones ---------- */
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',

  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

  gift:'<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8S10.5 3 8 4s-.5 4 4 4zM12 8s1.5-5 4-4 .5 4-4 4z"/>',
  bag:'<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/>',
  team:'<circle cx="12" cy="7" r="3"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/><circle cx="4.5" cy="10" r="2"/><circle cx="19.5" cy="10" r="2"/>',
  inbox:'<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4zM20 4h-6a3 3 0 0 0-3 3"/><path d="M20 4v13.5h-6.5A2.5 2.5 0 0 0 11 20"/>',

  `<div class="steps">${PERS.map((p,i)=>`<div class="step ${S.persDone[i]?'done':'now'}"><div class="num">${S.persDone[i]?'✓':i+1}</div><div><h3>${p.t}</h3><p>${p.d}</p></div><div class="r">${S.persDone[i]?`<span class="pill ok">feito</span>`:'<span class="pill go">pendente</span>'}<div class="mt"><a class="btn ${S.persDone[i]?'s':'p'} sm" href="#/personalizacao/${i+1}" ${[2,7].includes(i+1)?'':`onclick="toast('Formulário de exemplo: abra a etapa 2 ou 7');return false"`}>${S.persDone[i]?'Ver respostas':'Responder'}</a></div></div></div>`).join('')}</div>`;
};

P.metas = () => head('Metas e calculadora','Da meta do mês para o que precisa acontecer todo dia.') +
  `<div class="grid g2">
    <div class="card"><h3>Meta diária</h3>
      <label>Meta de faturamento do mês (R$)</label><input type="number" id="mMeta" value="60000">
      <div class="grid g2"><div><label>Dias de loja aberta</label><input type="number" id="mDias" value="26"></div><div><label>Ticket médio (R$)</label><input type="number" id="mTicket" value="${esc(S.perfil.ticket)}"></div></div>
      <label>Conversão (% de quem entra e compra)</label><input type="number" id="mConv" value="30">
      <div class="grid g3 mt" id="mOut"></div></div>
    <div class="card"><h3>Preço de venda</h3>
      <label>Custo da peça (R$)</label><input type="number" id="pCusto" value="89.90">
      <label>Markup</label><input type="number" id="pMk" value="2.6" step="0.1">
      <label>Desconto máximo na queima (%)</label><input type="number" id="pDesc" value="30">
      <div class="grid g3 mt" id="pOut"></div></div>
  </div>`;

P.scripts = (arg) => {
  if(arg){
    const cat = SCRIPT_CATS.find(c=>c.id===arg); const list = SCRIPTS[arg]||[];
    return `<a class="btn s sm mb" href="#/scripts">← Todos os scripts</a>` + head(cat.t,'Os campos em destaque já vêm da sua Personalização. O que estiver entre colchetes você completa na hora.') +
      list.map((s,i)=>`<div class="script"><h3>${s.t}</h3><div class="when">Quando usar: ${s.w}</div><pre>${fill(s.x)}</pre><div class="row"><button class="btn p sm" data-copy="${arg}|${i}">${ic('copy','width="15" height="15"')} Copiar</button><a class="btn s sm" href="#/assistente" data-ask="Adapte o script '${esc(s.t)}' para uma cliente específica">Adaptar com o Assistente</a></div></div>`).join('');
  }
  return head('Scripts de venda',`Mensagens prontas para a ${esc(S.perfil.loja)}, no seu tom de voz (${esc(S.perfil.tom)}).`) +
    `<div class="grid g3">${SCRIPT_CATS.map(c=>`<a class="scard" style="--c:${c.c}" href="#/scripts/${c.id}"><div class="ic">${ic(c.i)}</div><b>${c.t}</b><small>${(SCRIPTS[c.id]||[]).length} script${(SCRIPTS[c.id]||[]).length>1?'s':''} · abrir →</small></a>`).join('')}<a class="scard new" href="#/assistente" data-ask="Crie um script novo para ">+ Novo script com o Assistente</a></div>`;
};

P.planeje = (arg) => {
  if(arg!==undefined && arg!==''){
    const m = +arg, k = 'm'+m, d = S.planeje[k]||{};
    return `<a class="btn s sm mb" href="#/planeje">← Todos os meses</a>` + head(`🗓️ ${MESES[m]}`, `Datas comerciais: ${DATAS[m]}`) +
      `<div class="grid g2">${BLOCOS.map((b,i)=>`<div class="card"><h3>${b}</h3><textarea data-planeje="${k}|${i}" placeholder="Escreva aqui…">${esc(d[i]||'')}</textarea></div>`).join('')}</div>`;
  }
  return head('🗓️ PLANEJE AQUI','Um card por mês: datas comerciais, produtos em destaque, ações, meta e as 4 semanas.') +
    `<div class="grid g4">${MESES.map((m,i)=>{const filled=Object.values(S.planeje['m'+i]||{}).filter(Boolean).length;return `<a class="month" href="#/planeje/${i}"><b>${m}</b><small>${DATAS[i]}</small><div class="mt">${filled?`<span class="pill ok">${filled}/8 blocos</span>`:'<span class="pill no">a planejar</span>'}</div></a>`}).join('')}</div>`;
};

P.kanban = () => head('Kanban de conteúdo','Da ideia ao post publicado. Use as setas para mover os cards.') +
  `<div class="row mb"><input type="text" id="kNew" placeholder="Nova ideia de conteúdo…" style="max-width:420px"><button class="btn p" id="kAdd">Adicionar</button></div>
  <div class="kanban">${KCOLS.map((c,ci)=>{const cards=S.kanban.map((k,i)=>({...k,i})).filter(k=>k.c===ci);return `<div class="col"><h3>${c}<span class="muted">${cards.length}</span></h3>${cards.map(k=>`<div class="kc">${esc(k.t)}<div class="mv"><button data-km="${k.i}|-1" ${ci===0?'disabled':''}>←</button><button data-kdel="${k.i}" title="Excluir">✕</button><button data-km="${k.i}|1" ${ci===KCOLS.length-1?'disabled':''}>→</button></div></div>`).join('')}</div>`}).join('')}</div>`;

P['perfil-ig'] = () => head('Análise do perfil','O diagnóstico do Instagram da sua loja, com vídeo explicativo e roteiro.') +
  `<div class="card"><p>No Hub, a análise que hoje vai como link do GitHub fica dentro do portal da mentorada, junto com o Plano de Ação.</p><a class="btn p" href="../versatilita/" target="_blank" rel="noopener">Ver um exemplo de análise</a></div>`;

P.notas = () => head('Notas','Seu caderno dentro do Hub. Substitui as páginas soltas do Notion.') +
  `<div class="card mb"><input type="text" id="nT" placeholder="Título"><textarea id="nC" class="mt" placeholder="Escreva sua nota…"></textarea><div class="row mt"><button class="btn p" id="nAdd">Salvar nota</button></div></div>
  <div class="grid g3">${S.notas.map((n,i)=>`<div class="card"><h3>${esc(n.t)}</h3><p style="white-space:pre-wrap;margin:0 0 10px">${esc(n.c)}</p><button class="btn s sm" data-ndel="${i}">Excluir</button></div>`).join('')}</div>`;

P.cursos = () => head('Cursos e gravações','O portal do curso da metodologia completo e as gravações dos encontros.') +
  `<div class="grid g3">${['Módulo 1 · Gestão e números da loja','Módulo 2 · Time de vendas','Módulo 3 · Vitrine e experiência','Módulo 4 · Base de clientes e CRM','Módulo 5 · Instagram que vende','Módulo 6 · Estoque e compras'].map((m,i)=>`<div class="card"><div style="height:110px;border-radius:10px;background:var(--grad);opacity:${.55+i*.07};margin-bottom:12px;display:grid;place-items:center;color:#fff">${ic('play','width="34" height="34"')}</div><h3>${m}</h3><div class="bar"><i style="width:${[100,60,20,0,0,0][i]}%"></i></div></div>`).join('')}</div>`;

P.duvidas = () => head('Dúvidas entre os encontros','Respostas da Camilla às 10h e às 16h, de segunda a sexta. Prazo de até 12 horas úteis.') +
  `<div class="card mb"><textarea id="dq" placeholder="Escreva sua dúvida…"></textarea><div class="row mt"><button class="btn p" id="dSend">Enviar para a Camilla</button></div></div>
  <div class="card"><h3>Respondidas</h3><div class="check"><span><b>Posso mandar o script de aniversário por áudio?</b><br><span class="muted">Camilla: Pode e deve! Áudio curto, até 30 segundos, e depois o texto com o cupom.</span></span></div></div>`;

P.clientes = () => head('Gestão de clientes','Em breve: a base de clientes da loja com aniversário, última compra, curva A/B/C e lista de inativas para reativação.') + `<div class="card muted">Este módulo entra na fase 2.</div>`;
P.estoque = () => head('Giro de estoque','Em breve: suba a planilha do sistema e o Hub monta a Curva ABC e os blocos de queima no padrão Loja Magnética.') + `<div class="card muted">Este módulo entra na fase 2.</div>`;

P.assistente = () => head('✨ Assistente Magnética',`Treinado no método Loja Magnética e nos dados da ${esc(S.perfil.loja)}. No Hub real, quem responde aqui é o Claude.`) +
  `<div class="card chat"><div class="msgs" id="msgs">${(S.chat.length?S.chat:[{r:'a',t:`Oi, ${S.perfil.nome.split(' ')[0]}! Eu conheço a sua Personalização, o seu Plano de Ação e os scripts. Posso escrever uma mensagem para uma cliente, montar a ação do mês ou revisar a sua meta. Por onde começamos?`}]).map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')}</div>
  <div class="chips mt">${['Crie uma ação para o Dia das Crianças','Quanto preciso vender por dia?','Escreva uma mensagem de reativação'].map(s=>`<a class="chip" href="#/assistente" data-sug="${s}">${s}</a>`).join('')}</div>
  <div class="composer"><input type="text" id="ci" placeholder="Pergunte qualquer coisa sobre a sua loja…"><button class="btn p" id="cs">Enviar</button></div></div>`;

/* Equipe */
P.painel = () => head('Painel da equipe','Todos os portais em uma tela: em que passo cada loja está e quem precisa de atenção.') +
  `<div class="grid g4 mb">${[['5','portais ativos'],['4','reuniões esta semana'],['3','dúvidas pendentes'],['1','portal parado há 7+ dias']].map(([n,l])=>`<div class="card kpi"><b>${n}</b><small>${l}</small></div>`).join('')}</div>
  <div class="card tblwrap"><table class="tbl"><thead><tr><th>Loja</th><th>Passo</th><th>Plano de Ação</th><th>Próxima reunião</th><th>Último acesso</th><th></th></tr></thead><tbody>${MENTORADOS.map(m=>`<tr><td><b style="color:var(--ink)">${m.n}</b></td><td>${m.p}</td><td style="min-width:120px"><div class="bar"><i style="width:${m.pr}%"></i></div><small class="muted">${m.pr}%</small></td><td>${m.r}</td><td>${m.st==='bad'?`<span class="pill bad">${m.a}</span>`:m.st==='wa'?`<span class="pill wa">${m.a}</span>`:m.a}</td><td><a class="btn s sm" href="#/inicio" data-as="mentorado">Abrir portal</a></td></tr>`).join('')}</tbody></table></div>`;

P.caixa = () => head('Dúvidas pendentes','Responder às 10h e às 16h. Tudo em uma caixa só, sem caçar no Notion ou no WhatsApp.') +
  DUVIDAS.map((d,i)=>`<div class="card mb"><div class="row" style="justify-content:space-between"><b style="color:var(--ink)">${d.l}</b><small class="muted">${d.h}</small></div><p>${d.q}</p><textarea placeholder="Sua resposta…"></textarea><div class="row mt"><button class="btn p sm" onclick="toast('Resposta enviada para ${d.l}')">Responder</button><button class="btn s sm" onclick="toast('Rascunho gerado pelo Assistente')">Rascunho com o Assistente</button></div></div>`).join('');

P.agenda = () => head('Reuniões da semana','Puxadas do Google Agenda (suportelojamagnetica@gmail.com). Eventos roxos de lead do comercial ficam de fora.') +
  `<div class="card tblwrap"><table class="tbl"><thead><tr><th>Quando</th><th>Loja</th><th>Tema</th><th>Status</th></tr></thead><tbody>${[['Seg 06/10 10h','Boutique Aurora','Plano de Ação: Mês 1'],['Ter 07/10 15h','Casa Lume Moda','Devolutiva do Diagnóstico'],['Qua 08/10 14h','Maré Store','Consultoria: estoque'],['Qui 09/10 11h','Vila Linho','Revisão de números']].map(r=>`<tr><td>${r[0]}</td><td><b style="color:var(--ink)">${r[1]}</b></td><td>${r[2]}</td><td><span class="pill wa">Pendente</span></td></tr>`).join('')}</tbody></table></div>`;

P.novo = () => head('Novo portal','Cria o PORTAL DA MENTORIA a partir do modelo, com os 7 passos, PLANEJE AQUI e Reuniões já prontos.') +
  `<div class="card" style="max-width:640px"><label>Nome da loja</label><input type="text" placeholder="Ex.: Ateliê Flor de Sal"><div class="grid g2"><div><label>Responsável</label><input type="text"></div><div><label>WhatsApp</label><input type="text"></div></div><div class="grid g2"><div><label>Tipo</label><select><option>Mentoria</option><option>Mentoria VIP Anual</option><option>Consultoria</option></select></div><div><label>Início</label><input type="date"></div></div><label class="check" style="font-weight:400"><input type="checkbox" checked><span>Enviar convite de acesso por e-mail</span></label><div class="row mt"><button class="btn p" onclick="toast('Portal criado (exemplo)')">Criar portal</button></div></div>`;

P.biblioteca = () => head('Biblioteca','O que a equipe edita uma vez e aparece para todos os portais.') +
  `<div class="grid g3">${[['chat','Scripts modelo','12 categorias'],['play','Aulas e gravações','6 módulos'],['map','Modelo da jornada','7 passos + textos do Onboarding'],['cal','Datas comerciais','12 meses'],['note','Questionários','7 etapas da Personalização'],['spark','Instruções do Assistente','Método e tom da Camilla']].map(([i,t,s])=>`<div class="card"><div class="sc" style="border:0;padding:0;text-align:left"><div class="ic" style="margin:0 0 10px">${ic(i)}</div></div><h3>${t}</h3><p class="muted" style="margin:0">${s}</p></div>`).join('')}</div>`;

/* ---------- Assistente (simulado) ---------- */
function reply(q){
  const t = q.toLowerCase(), f = S.perfil.nome.split(' ')[0];
  if(/dia|vender|meta/.test(t) && /dia|meta/.test(t)) return `Com meta de R$ 60.000 em 26 dias, são R$ 2.308 por dia. Com ticket de R$ ${S.perfil.ticket}, dá umas ${Math.ceil(2308/(+S.perfil.ticket||1))} vendas por dia. Se a conversão for de 30%, você precisa de cerca de ${Math.ceil(2308/(+S.perfil.ticket||1)/0.3)} atendimentos por dia.\n\nQuer que eu monte a meta por vendedora?`;
  if(/reativ|sumid|inativ/.test(t)) return plain(SCRIPTS.reativacao[0].x).replace('{cliente}','Juliana') + `\n\nTroquei o nome para Juliana como exemplo. Me fala o estilo dela que eu ajusto as peças.`;
  if(/crian|ação|acao|campanha/.test(t)) return `Ação para o Dia das Crianças na ${S.perfil.loja}:\n\n1. Semana 1: stories "Mãe e filha combinando" com 3 looks.\n2. Semana 2: lista VIP para as clientes com filhos, com brinde na compra acima de R$ 300.\n3. Dia 10/10: Reels com cliente real e o filho.\n4. Meta: 15% acima de outubro do ano passado.\n\nQuer que eu salve isso em Outubro no PLANEJE AQUI?`;
  return `Boa pergunta, ${f}! No Hub real eu respondo com o Claude, usando a sua Personalização (tom ${S.perfil.tom}, ticket de R$ ${S.perfil.ticket}), o seu Plano de Ação e o método Loja Magnética.\n\nNeste protótipo, experimente: "Quanto preciso vender por dia?"`;
}

/* ---------- Roteador ---------- */
function route(){
  const [r='',arg] = location.hash.replace(/^#\/?/,'').split('/');
  const def = S.role==='equipe' ? 'painel' : 'inicio';
  const name = P[r] ? r : def;
  renderNav(name);
  document.getElementById('view').innerHTML = P[name](arg);
  document.getElementById('side').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  window.scrollTo(0,0);
  after(name);
}
function after(name){
  if(name==='metas'){
    const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
    const calc = () => {
      const g = id => +document.getElementById(id).value || 0;
      const dia = g('mMeta')/Math.max(g('mDias'),1), vendas = dia/Math.max(g('mTicket'),1), at = vendas/Math.max(g('mConv')/100,.01);
      document.getElementById('mOut').innerHTML = [[brl(dia),'por dia'],[Math.ceil(vendas),'vendas por dia'],[Math.ceil(at),'atendimentos por dia']].map(([n,l])=>`<div class="kpi"><b style="font-size:20px">${n}</b><small>${l}</small></div>`).join('');
      const pv = g('pCusto')*g('pMk'), pq = pv*(1-g('pDesc')/100);
      document.getElementById('pOut').innerHTML = [[brl(pv),'preço de venda'],[brl(pq),'preço na queima'],[(pq/Math.max(g('pCusto'),.01)).toFixed(2)+'x','markup na queima']].map(([n,l])=>`<div class="kpi"><b style="font-size:20px">${n}</b><small>${l}</small></div>`).join('');
    };
    document.querySelectorAll('#view input').forEach(i=>i.addEventListener('input',calc)); calc();
  }
  if(name==='assistente'){
    const box = document.getElementById('msgs'); box.scrollTop = box.scrollHeight;
    const ask = sessionGet('ask'); if(ask){ document.getElementById('ci').value = ask; sessionSet('ask',''); }
  }
}
function sessionGet(k){ try{ return sessionStorage.getItem(k)||''; }catch(e){ return ''; } }
function sessionSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-role],[data-copy],[data-km],[data-kdel],[data-ndel],[data-sug],[data-ask],[data-as],#savePerfil,#finishPers,#kAdd,#nAdd,#dSend,#cs,#burger,#overlay,#themeBtn,#fontBtn');
  if(!t) return;
  if(t.dataset.role){ S.role=t.dataset.role; save(); location.hash = S.role==='equipe'?'#/painel':'#/inicio'; route(); return; }
  if(t.dataset.as){ S.role=t.dataset.as; save(); return; }
  if(t.dataset.copy){ const [c,i]=t.dataset.copy.split('|'); const txt=plain(SCRIPTS[c][+i].x); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Script copiado'),()=>toast('Não foi possível copiar')); return; }
  if(t.dataset.km){ const [i,d]=t.dataset.km.split('|').map(Number); S.kanban[i].c=Math.min(KCOLS.length-1,Math.max(0,S.kanban[i].c+d)); save(); route(); return; }
  if(t.dataset.kdel){ S.kanban.splice(+t.dataset.kdel,1); save(); route(); return; }
  if(t.dataset.ndel){ S.notas.splice(+t.dataset.ndel,1); save(); route(); return; }
  if(t.dataset.ask){ sessionSet('ask', t.dataset.ask); return; }
  if(t.dataset.sug){ e.preventDefault(); document.getElementById('ci').value=t.dataset.sug; document.getElementById('cs').click(); return; }
  switch(t.id){
    case 'savePerfil': document.querySelectorAll('[data-p]').forEach(i=>S.perfil[i.dataset.p]=i.value); save(); toast('Personalização salva'); renderNav('personalizacao'); break;
    case 'finishPers': S.persDone[6]=true; save(); toast('Personalização concluída 🎉'); location.hash='#/personalizacao'; break;
    case 'kAdd': { const v=document.getElementById('kNew').value.trim(); if(v){ S.kanban.push({t:v,c:0}); save(); route(); } break; }
    case 'nAdd': { const tt=document.getElementById('nT').value.trim(), cc=document.getElementById('nC').value.trim(); if(tt||cc){ S.notas.unshift({t:tt||'Sem título',c:cc}); save(); route(); } break; }
    case 'dSend': { const q=document.getElementById('dq'); if(q.value.trim()){ q.value=''; toast('Dúvida enviada. A Camilla responde às 10h ou às 16h.'); } break; }
    case 'cs': { const inp=document.getElementById('ci'), q=inp.value.trim(); if(!q) break; if(!S.chat.length) S.chat.push({r:'a',t:`Oi, ${S.perfil.nome.split(' ')[0]}! Por onde começamos?`}); S.chat.push({r:'u',t:q},{r:'a',t:reply(q)}); S.chat=S.chat.slice(-30); save(); route(); break; }
    case 'burger': document.getElementById('side').classList.add('open'); document.getElementById('overlay').classList.add('open'); break;
    case 'overlay': document.getElementById('side').classList.remove('open'); t.classList.remove('open'); break;
    case 'themeBtn': { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; break; }
    case 'fontBtn': { const r=document.documentElement; const cur=parseFloat(getComputedStyle(r).getPropertyValue('--fs'))||15; r.style.setProperty('--fs', (cur>=18?15:cur+1.5)+'px'); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.plano){ S.plano[t.dataset.plano]=t.checked; save(); route(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.planeje){ const [k,i]=t.dataset.planeje.split('|'); (S.planeje[k]=S.planeje[k]||{})[i]=t.value; save(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.id==='ci') document.getElementById('cs').click();
  if(e.key==='Enter' && e.target.id==='q'){
    const q = e.target.value.toLowerCase().trim(); if(!q) return;
    const hit = NAV.mentorado.find(n=>n.l && n.l.toLowerCase().includes(q)) || SCRIPT_CATS.find(c=>c.t.toLowerCase().includes(q));
    if(hit){ S.role='mentorado'; location.hash = hit.l ? '#/'+hit.id : '#/scripts/'+hit.id; } else toast('Nada encontrado para "'+q+'"');
  }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
